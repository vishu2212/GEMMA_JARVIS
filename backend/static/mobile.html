<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JARVIS Mobile AI Lens</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
    body { background: #090d16; color: #f8fafc; text-align: center; padding: 1rem; display: flex; flex-direction: column; height: 100vh; justify-content: space-between; }
    .header { padding: 0.5rem 0; }
    .header h1 { font-size: 1.5rem; color: #06b6d4; font-weight: 800; letter-spacing: 0.5px; }
    .header p { font-size: 0.85rem; color: #94a3b8; margin-top: 0.2rem; }
    .video-wrap { position: relative; width: 100%; flex: 1; background: #020617; border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,0.12); margin: 0.75rem 0; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 8px 30px rgba(0,0,0,0.4); }
    video { width: 100%; height: 100%; object-fit: cover; }
    canvas { display: none; }
    .preview-img { max-width: 100%; max-height: 100%; border-radius: 12px; object-fit: contain; }
    .btn-group { display: flex; flex-direction: column; gap: 0.75rem; width: 100%; }
    .btn { background: linear-gradient(135deg, #06b6d4, #3b82f6); color: white; border: none; padding: 1rem 1.5rem; border-radius: 30px; font-size: 1.05rem; font-weight: 700; cursor: pointer; width: 100%; box-shadow: 0 4px 20px rgba(6,182,212,0.4); display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
    .btn-accent { background: linear-gradient(135deg, #8b5cf6, #c084fc); box-shadow: 0 4px 20px rgba(139,92,246,0.4); }
    .btn-danger { background: #ef4444; }
    .status-badge { display: inline-flex; align-items: center; gap: 0.5rem; background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); padding: 0.45rem 1.2rem; border-radius: 20px; font-size: 0.88rem; font-weight: 600; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #10b981; box-shadow: 0 0 10px #10b981; }
    .scan-effect { position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: linear-gradient(90deg, transparent, #06b6d4, transparent); animation: scan 2s infinite linear; }
    @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
  </style>
</head>
<body>
  <div class="header">
    <h1>📱 JARVIS WIRELESS LENS</h1>
    <p>Live Phone Camera Stream to PC & ESP32 Speaker</p>
  </div>

  <div class="video-wrap">
    <video id="mobile-video" autoplay playsinline muted></video>
    <img id="preview-img" class="preview-img" style="display:none;" />
    <div id="placeholder-view" style="display:none;">
      <span style="font-size: 3.5rem; opacity: 0.5;">📷</span>
      <p style="margin-top:0.5rem; font-size:0.9rem; color:#94a3b8;">Point phone camera at breadboard circuit</p>
    </div>
    <div class="scan-effect" id="scan-effect"></div>
    <canvas id="mobile-canvas"></canvas>
  </div>

  <div id="server-config-bar" style="margin: 10px 16px; padding: 10px; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); border-radius: 10px; text-align: center; display: none;">
    <div style="font-size:0.8rem; color:#fca5a5; font-weight:700; margin-bottom:6px;">⚠️ PC Server URL (e.g. http://192.168.1.111:8001):</div>
    <div style="display:flex; gap:6px; justify-content:center;">
      <input type="text" id="input-api-url" placeholder="http://192.168.1.111:8001" style="background:#09090b; border:1px solid #3f3f46; color:#fff; padding:6px 10px; border-radius:6px; font-size:0.8rem; width:70%;">
      <button id="btn-save-api-url" style="background:#06b6d4; color:#000; font-weight:700; border:none; padding:6px 12px; border-radius:6px; font-size:0.8rem;">Save</button>
    </div>
  </div>

  <div class="footer">
    <div id="status-box" style="margin-bottom: 0.85rem;">
      <span class="status-badge"><span class="dot"></span> <span id="status-text">Connecting Rear Camera...</span></span>
    </div>

    <!-- Hidden Native Camera File Input -->
    <input type="file" id="mobile-file-input" accept="image/*" capture="environment" style="display:none;">

    <div class="btn-group">
      <button id="btn-snap-photo" class="btn btn-accent">📸 Snap High-Res Photo</button>
      <button id="btn-toggle-stream" class="btn">📹 Stream Live Frames to PC</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('mobile-video');
    const canvas = document.getElementById('mobile-canvas');
    const previewImg = document.getElementById('preview-img');
    const placeholderView = document.getElementById('placeholder-view');
    const btnStream = document.getElementById('btn-toggle-stream');
    const btnSnap = document.getElementById('btn-snap-photo');
    const fileInput = document.getElementById('mobile-file-input');
    const statusText = document.getElementById('status-text');
    const scanEffect = document.getElementById('scan-effect');

    const configBar = document.getElementById('server-config-bar');
    const inputApiUrl = document.getElementById('input-api-url');
    const btnSaveApiUrl = document.getElementById('btn-save-api-url');

    let stream = null;
    let frameInterval = null;

    // 1. Auto-Start Rear Camera on Page Load
    startRearCamera();

    async function startRearCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
        video.style.display = "block";
        placeholderView.style.display = "none";
        statusText.textContent = "Rear Camera Lens Live";

        // Auto-start live stream to PC
        startLiveStream();
      } catch (err) {
        console.error("Rear camera error:", err);
        statusText.textContent = "Using Native Camera Photo Snap";
        video.style.display = "none";
        placeholderView.style.display = "flex";
        scanEffect.style.display = "none";
      }
    }

    let API_BASE = (typeof window !== 'undefined' && window.ENV_API_URL)
      || (localStorage.getItem('JARVIS_API_BASE'))
      || (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
          ? 'http://localhost:8001' 
          : window.location.origin);

    if (inputApiUrl) inputApiUrl.value = API_BASE;
    btnSaveApiUrl?.addEventListener('click', () => {
      let val = inputApiUrl.value.trim().replace(/\/+$/, '');
      if (val) {
        localStorage.setItem('JARVIS_API_BASE', val);
        API_BASE = val;
        alert('PC Server URL saved: ' + val);
        configBar.style.display = 'none';
        statusText.textContent = 'PC Server URL Updated!';
      }
    });

    function showConfigBar(msg) {
      if (configBar) configBar.style.display = 'block';
      statusText.textContent = msg || 'Error Uploading Photo to PC';
    }

    async function sendFrameToPC() {
      if (!stream) return;
      const ctx = canvas.getContext('2d');
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      canvas.toBlob(async (blob) => {
        if (!blob) return;
        const formData = new FormData();
        formData.append('file', blob, 'mobile_frame.jpg');
        try {
          const res = await fetch(`${API_BASE}/mobile/frame`, { method: 'POST', body: formData });
          if (!res.ok) {
            showConfigBar('Server 404/405 - Verify PC Server URL');
          }
        } catch (err) {
          console.error('Error streaming frame to PC:', err);
          showConfigBar('Network Error - Check PC Server URL');
        }
      }, 'image/jpeg', 0.85);
    }

    function startLiveStream() {
      if (frameInterval) clearInterval(frameInterval);
      frameInterval = setInterval(sendFrameToPC, 300);
      btnStream.innerHTML = "⏹ Stop Streaming";
      btnStream.classList.add("btn-accent");
      scanEffect.style.display = "block";
    }

    btnStream.addEventListener("click", () => {
      if (frameInterval) {
        clearInterval(frameInterval);
        frameInterval = null;
        btnStream.innerHTML = "📹 Stream Live Frames to PC";
        btnStream.classList.remove("btn-accent");
        scanEffect.style.display = "none";
      } else {
        startLiveStream();
      }
    });

    // 2. Native Camera High-Res Photo Fallback (Works on 100% of HTTP mobile browsers)
    btnSnap.addEventListener('click', () => {
      fileInput.click();
    });

    fileInput.addEventListener('change', async (e) => {
      if (!e.target.files || !e.target.files[0]) return;
      const rawFile = e.target.files[0];

      previewImg.src = URL.createObjectURL(rawFile);
      previewImg.style.display = 'block';
      video.style.display = 'none';
      placeholderView.style.display = 'none';

      statusText.textContent = 'Compressing & Uploading Photo to PC...';

      const img = new Image();
      img.onload = () => {
        const maxDim = 1920;
        let w = img.width;
        let h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w > h) {
            h = Math.round((h * maxDim) / w);
            w = maxDim;
          } else {
            w = Math.round((w * maxDim) / h);
            h = maxDim;
          }
        }
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);

        canvas.toBlob(async (blob) => {
          if (!blob) return;
          const formData = new FormData();
          formData.append('file', blob, 'photo_frame.jpg');

          try {
            const res = await fetch(`${API_BASE}/mobile/frame`, { method: 'POST', body: formData });
            const data = await res.json().catch(() => ({}));
            if (res.ok && data.status === 'received') {
              statusText.textContent = '✓ Frame Uploaded! Tap Inspect on PC or Snap Another Photo.';
            } else {
              showConfigBar('Server error - Set PC Server URL below');
            }
          } catch (err) {
            console.error('Upload error:', err);
            showConfigBar('Network Error - Set PC Server URL below');
          }
        }, 'image/jpeg', 0.85);
      };
      img.src = URL.createObjectURL(rawFile);
    });
  </script>
</body>
</html>
